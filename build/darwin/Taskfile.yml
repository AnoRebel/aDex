version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Creates a production build of the application
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.VERSION}} -X main.buildDate={{.BUILD_DATE}} -X main.commit={{.COMMIT}}"{{else}}-buildvcs=false -gcflags=all="-l" -X main.version=dev-{{.VERSION}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      VERSION: '{{.VERSION | default "1.0.0"}}'
      BUILD_DATE: '{{.BUILD_DATE | default (now | date "2006-01-02T15:04:05Z")}}'
      COMMIT: '{{.COMMIT | default (shell "git rev-parse --short HEAD 2>/dev/null || echo unknown")}}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=10.15"
      CGO_LDFLAGS: "-mmacosx-version-min=10.15"
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:
    summary: Packages a production build of the application into a `.app` bundle
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle


  create:app:bundle:
    summary: Creates an `.app` bundle
    deps:
      - task: update:metadata
    cmds:
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/{MacOS,Resources,Frameworks}
      - cp build/darwin/icons.icns {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS
      - cp build/darwin/Info.plist {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents
      - '{{if .CODESIGN_IDENTITY}}codesign --force --deep --sign "{{.CODESIGN_IDENTITY}}" {{.BIN_DIR}}/{{.APP_NAME}}.app{{else}}codesign --force --deep --sign - {{.BIN_DIR}}/{{.APP_NAME}}.app{{end}}'
    vars:
      CODESIGN_IDENTITY: '{{.CODESIGN_IDENTITY | default ""}}'

  codesign:
    summary: Code signs the app bundle with developer certificate
    deps:
      - task: create:app:bundle
    cmds:
      - |-
        if [ -z "{{.CODESIGN_IDENTITY}}" ]; then
          echo "ERROR: CODESIGN_IDENTITY environment variable is required for code signing"
          echo "Usage: CODESIGN_IDENTITY=\"Developer ID Application: Your Name\" task darwin:codesign"
          exit 1
        fi
      - codesign --force --deep --sign "{{.CODESIGN_IDENTITY}}" {{.BIN_DIR}}/{{.APP_NAME}}.app
      - codesign --verify --verbose {{.BIN_DIR}}/{{.APP_NAME}}.app
    vars:
      CODESIGN_IDENTITY: '{{.CODESIGN_IDENTITY | default ""}}'

  notarize:
    summary: Notarizes the app bundle with Apple
    deps:
      - task: codesign
    cmds:
      - |-
        if [ -z "{{.APPLE_ID}}" ] || [ -z "{{.APPLE_PASSWORD}}" ] || [ -z "{{.APPLE_TEAM_ID}}" ]; then
          echo "ERROR: APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID environment variables are required for notarization"
          echo "Usage: APPLE_ID=\"your@email.com\" APPLE_PASSWORD=\"app-specific-password\" APPLE_TEAM_ID=\"YOUR_TEAM_ID\" task darwin:notarize"
          exit 1
        fi
      - |-
        # Create zip file for notarization
        ditto -c -k --keepParent {{.BIN_DIR}}/{{.APP_NAME}}.app {{.BIN_DIR}}/{{.APP_NAME}}.zip
      - |-
        # Submit for notarization
        xcrun notarytool submit {{.BIN_DIR}}/{{.APP_NAME}}.zip \
          --apple-id "{{.APPLE_ID}}" \
          --password "{{.APPLE_PASSWORD}}" \
          --team-id "{{.APPLE_TEAM_ID}}" \
          --wait
      - |-
        # Staple the notarization
        xcrun stapler staple {{.BIN_DIR}}/{{.APP_NAME}}.app
      - |-
        # Verify notarization
        xcrun stapler validate {{.BIN_DIR}}/{{.APP_NAME}}.app
      - rm {{.BIN_DIR}}/{{.APP_NAME}}.zip
    vars:
      APPLE_ID: '{{.APPLE_ID | default ""}}'
      APPLE_PASSWORD: '{{.APPLE_PASSWORD | default ""}}'
      APPLE_TEAM_ID: '{{.APPLE_TEAM_ID | default ""}}'

  create:dmg:
    summary: Creates a DMG installer package
    deps:
      - task: create:app:bundle
    cmds:
      - |-
        # Create DMG
        hdiutil create -volname "{{.APP_NAME}}" -srcfolder {{.BIN_DIR}}/{{.APP_NAME}}.app -ov -format UDZO {{.BIN_DIR}}/{{.APP_NAME}}.dmg
      - |-
        # Optional: Add license and background to DMG
        if [ -f "build/darwin/license.txt" ]; then
          hdiutil unflatten {{.BIN_DIR}}/{{.APP_NAME}}.dmg
          /usr/libexec/PlistBuddy -c "Add :English:license string $(cat build/darwin/license.txt)" {{.BIN_DIR}}/{{.APP_NAME}}.dmg.plist
          hdiutil flatten {{.BIN_DIR}}/{{.APP_NAME}}.dmg
        fi
      - |-
        # Sign DMG if certificate is provided
        {{if .CODESIGN_IDENTITY}}codesign --sign "{{.CODESIGN_IDENTITY}}" {{.BIN_DIR}}/{{.APP_NAME}}.dmg{{end}}
    vars:
      CODESIGN_IDENTITY: '{{.CODESIGN_IDENTITY | default ""}}'

  update:metadata:
    summary: Updates Info.plist with current build metadata
    cmds:
      - |-
        # Update Info.plist with current version and build info
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion {{.VERSION}}" build/darwin/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString {{.VERSION}}" build/darwin/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleGetInfoString {{.APP_NAME}} version {{.VERSION}}" build/darwin/Info.plist
        /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright Copyright © {{shell "date +%Y"}} {{.COMPANY_NAME | default "HackEAC"}}" build/darwin/Info.plist
    vars:
      VERSION: '{{.VERSION | default "1.0.0"}}'
      COMPANY_NAME: '{{.COMPANY_NAME | default "HackEAC"}}'

  clean:
    summary: Clean macOS build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}/{{.APP_NAME}}.app
      - rm -f {{.BIN_DIR}}/{{.APP_NAME}}.dmg
      - rm -f {{.BIN_DIR}}/{{.APP_NAME}}.zip

  run:
    cmds:
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/{MacOS,Resources}
      - cp build/darwin/icons.icns {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS
      - cp build/darwin/Info.dev.plist {{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist
      - codesign --force --deep --sign - {{.BIN_DIR}}/{{.APP_NAME}}.dev.app
      - '{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}'
