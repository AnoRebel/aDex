<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- aDex application icon.
       A terminal prompt inside the panel frame the interface uses everywhere:
       corner brackets, hairline grid, and the Tron accent (170,207,209) that
       is the app's default theme. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1014"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfeef0"/>
      <stop offset="1" stop-color="#7fb3b6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Faint grid, echoing the interface background. -->
  <g stroke="rgb(170,207,209)" stroke-opacity="0.07" stroke-width="2">
    <path d="M96 0V512M192 0V512M288 0V512M384 0V512"/>
    <path d="M0 96H512M0 192H512M0 288H512M0 384H512"/>
  </g>

  <!-- Panel border. -->
  <rect x="48" y="48" width="416" height="416" rx="64"
        fill="none" stroke="rgb(170,207,209)" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Corner brackets — the .mod-panel motif. -->
  <g fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round">
    <path d="M96 150V116a20 20 0 0 1 20-20h34"/>
    <path d="M362 96h34a20 20 0 0 1 20 20v34"/>
    <path d="M416 362v34a20 20 0 0 1-20 20h-34"/>
    <path d="M150 416h-34a20 20 0 0 1-20-20v-34"/>
  </g>

  <!-- Prompt chevron + input rule. -->
  <g filter="url(#glow)">
    <path d="M168 196l64 60-64 60" fill="none" stroke="url(#accent)"
          stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="256" y="296" width="96" height="22" rx="11" fill="url(#accent)"/>
  </g>
</svg>
