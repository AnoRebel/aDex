version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          PRODUCTION:
            ref: .PRODUCTION
      - task: common:generate:icons
      - task: update:metadata
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.VERSION}} -X main.buildDate={{.BUILD_DATE}} -X main.commit={{.COMMIT}}"{{else}}-buildvcs=false -gcflags=all="-l" -X main.version=dev-{{.VERSION}}"{{end}}'
      VERSION: '{{.VERSION | default "1.0.0"}}'
      BUILD_DATE: '{{.BUILD_DATE | default (now | date "2006-01-02T15:04:05Z")}}'
      COMMIT: '{{.COMMIT | default (shell "git rev-parse --short HEAD 2>/dev/null || echo unknown")}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application for Linux
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: create:tarball
      - task: create:appimage
      - task: package:appimage
      - task: create:deb
      - task: create:rpm
      - task: create:aur
      - task: create:snap

  create:appimage:
    summary: Creates an AppImage
    dir: build/linux/appimage
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
      - task: generate:dotdesktop
      - task: create:appimage:desktop
    cmds:
      - |
        # Clean previous build
        rm -rf build
        mkdir -p build

        # Copy binary and icon
        cp {{.APP_BINARY}} {{.APP_NAME}}
        cp ../../appicon.png {{.APP_NAME}}.png

        # Create AppDir structure
        mkdir -p build/{{.APP_NAME}}.AppDir/usr/bin
        mkdir -p build/{{.APP_NAME}}.AppDir/usr/share/applications
        mkdir -p build/{{.APP_NAME}}.AppDir/usr/share/icons/hicolor/256x256/apps
        mkdir -p build/{{.APP_NAME}}.AppDir/usr/lib

        # Copy files to AppDir
        cp {{.APP_NAME}} build/{{.APP_NAME}}.AppDir/usr/bin/
        cp ../{{.APP_NAME}}.desktop build/{{.APP_NAME}}.AppDir/usr/share/applications/
        cp ../../appicon.png build/{{.APP_NAME}}.AppDir/usr/share/icons/hicolor/256x256/apps/{{.APP_NAME}}.png

        # Create AppRun script
        echo '#!/bin/bash' > build/{{.APP_NAME}}.AppDir/AppRun
        echo 'APPDIR="$(dirname "$(readlink -f "\$0")")"' >> build/{{.APP_NAME}}.AppDir/AppRun
        echo 'export PATH="${APPDIR}/usr/bin/:${PATH}"' >> build/{{.APP_NAME}}.AppDir/AppRun
        echo 'export LD_LIBRARY_PATH="${APPDIR}/usr/lib/:${LD_LIBRARY_PATH}"' >> build/{{.APP_NAME}}.AppDir/AppRun
        echo 'export QT_PLUGIN_PATH="${APPDIR}/usr/plugins/"' >> build/{{.APP_NAME}}.AppDir/AppRun
        echo 'exec "${APPDIR}/usr/bin/{{.APP_NAME}}" "\$@"' >> build/{{.APP_NAME}}.AppDir/AppRun
        chmod +x build/{{.APP_NAME}}.AppDir/AppRun

        # Generate AppImage using appimagetool if available, fallback to wails3
        if command -v appimagetool >/dev/null 2>&1; then
          appimagetool --no-appstream --verbose build/{{.APP_NAME}}.AppDir {{.OUTPUT_DIR}}/{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage
        else
          echo "appimagetool not found, using wails3 generate appimage"
          wails3 generate appimage -binary {{.APP_NAME}} -icon {{.ICON}} -desktopfile {{.DESKTOP_FILE}} -outputdir {{.OUTPUT_DIR}} -builddir {{.ROOT_DIR}}/build/linux/appimage/build
          mv {{.OUTPUT_DIR}}/{{.APP_NAME}}.AppImage {{.OUTPUT_DIR}}/{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage 2>/dev/null || true
        fi

        # Create update information for AppImageUpdate (optional)
        echo "zsync|{{.HOMEPAGE}}/releases/latest/{{.APP_NAME}}-x86_64.AppImage.zsync" > build/{{.APP_NAME}}.AppDir/AppImageUpdate 2>/dev/null || true
    vars:
      APP_NAME: '{{.APP_NAME}}'
      APP_BINARY: '../../../bin/{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}.png'
      DESKTOP_FILE: '../{{.APP_NAME}}.desktop'
      OUTPUT_DIR: '../../../bin'
      VERSION: '{{.VERSION | default "1.0.0"}}'
      HOMEPAGE: '{{.HOMEPAGE | default "https://github.com/hackeac/adex-ui"}}'

  create:appimage:desktop:
    summary: Creates desktop file for AppImage
    dir: build
    cmds:
      - |
        echo '[Desktop Entry]' > linux/{{.APP_NAME}}.desktop
        echo 'Version=1.0' >> linux/{{.APP_NAME}}.desktop
        echo 'Type=Application' >> linux/{{.APP_NAME}}.desktop
        echo 'Name={{.APP_NAME}}' >> linux/{{.APP_NAME}}.desktop
        echo 'Comment={{.DESCRIPTION | default "A science fiction desktop running everywhere"}}' >> linux/{{.APP_NAME}}.desktop
        echo 'Exec={{.APP_NAME}}' >> linux/{{.APP_NAME}}.desktop
        echo 'Icon={{.APP_NAME}}' >> linux/{{.APP_NAME}}.desktop
        echo 'Terminal=false' >> linux/{{.APP_NAME}}.desktop
        echo 'Categories=Development;System;TerminalEmulator;' >> linux/{{.APP_NAME}}.desktop
        echo 'Keywords=terminal;console;shell;command;line;science;fiction;desktop;' >> linux/{{.APP_NAME}}.desktop
        echo 'StartupNotify=true' >> linux/{{.APP_NAME}}.desktop
        echo 'StartupWMClass={{.APP_NAME}}' >> linux/{{.APP_NAME}}.desktop
        echo 'MimeType=text/plain;' >> linux/{{.APP_NAME}}.desktop
    vars:
      APP_NAME: '{{.APP_NAME}}'
      DESCRIPTION: '{{.DESCRIPTION | default "A science fiction desktop running everywhere"}}'

  package:appimage:
    summary: Creates standalone AppImage package
    deps:
      - task: create:appimage
    cmds:
      - |
        # Create AppImage bundle directory
        mkdir -p {{.BIN_DIR}}/appimage-bundle
        cp {{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage {{.BIN_DIR}}/appimage-bundle/

        # Create README for AppImage
        echo '# {{.APP_NAME}} AppImage' > {{.BIN_DIR}}/appimage-bundle/README.md
        echo '' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo '## Installation' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo '1. Download the {{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage file' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo '2. Make it executable: `chmod +x {{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage`' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo '3. Run it: `./{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage`' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo '' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo '## Integration (Optional)' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo 'To integrate with your desktop environment:' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo '```bash' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo './{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage --install-desktop' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo '```' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo '' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo '## Uninstall' >> {{.BIN_DIR}}/appimage-bundle/README.md
        echo 'Simply delete the AppImage file and any desktop shortcuts you created.' >> {{.BIN_DIR}}/appimage-bundle/README.md

        # Create install script
        echo '#!/bin/bash' > {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'set -e' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'APPIMAGE="{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'INSTALL_DIR="\$HOME/.local/bin"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'DESKTOP_DIR="\$HOME/.local/share/applications"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'ICON_DIR="\$HOME/.local/share/icons/hicolor/256x256/apps"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '# Create directories' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'mkdir -p "\$INSTALL_DIR"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'mkdir -p "\$DESKTOP_DIR"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'mkdir -p "\$ICON_DIR"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '# Install AppImage' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'cp "\$APPIMAGE" "\$INSTALL_DIR/"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'chmod +x "\$INSTALL_DIR/\$APPIMAGE"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '# Create desktop entry' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "[Desktop Entry]" > "\$DESKTOP_DIR/{{.APP_NAME}}.desktop"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "Version=1.0" >> "\$DESKTOP_DIR/{{.APP_NAME}}.desktop"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "Type=Application" >> "\$DESKTOP_DIR/{{.APP_NAME}}.desktop"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "Name={{.APP_NAME}}" >> "\$DESKTOP_DIR/{{.APP_NAME}}.desktop"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "Comment={{.DESCRIPTION | default \"A science fiction desktop running everywhere\"}}" >> "\$DESKTOP_DIR/{{.APP_NAME}}.desktop"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "Exec=\$INSTALL_DIR/\$APPIMAGE %U" >> "\$DESKTOP_DIR/{{.APP_NAME}}.desktop"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "Icon={{.APP_NAME}}" >> "\$DESKTOP_DIR/{{.APP_NAME}}.desktop"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "Terminal=false" >> "\$DESKTOP_DIR/{{.APP_NAME}}.desktop"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "Categories=Development;System;TerminalEmulator;" >> "\$DESKTOP_DIR/{{.APP_NAME}}.desktop"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '# Extract and install icon' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '"\$INSTALL_DIR/\$APPIMAGE" --appimage-extract usr/share/icons/hicolor/256x256/apps/{{.APP_NAME}}.png 2>/dev/null || true' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'cp squashfs-root/usr/share/icons/hicolor/256x256/apps/{{.APP_NAME}}.png "\$ICON_DIR/" 2>/dev/null || cp {{.APP_NAME}}.png "\$ICON_DIR/" 2>/dev/null || true' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'rm -rf squashfs-root 2>/dev/null || true' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '# Update desktop database' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'update-desktop-database "\$DESKTOP_DIR" 2>/dev/null || true' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo '' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "✅ {{.APP_NAME}} AppImage installed successfully!"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "Run with: \$INSTALL_DIR/\$APPIMAGE"' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        echo 'echo "Or find it in your applications menu."' >> {{.BIN_DIR}}/appimage-bundle/install-appimage.sh
        chmod +x {{.BIN_DIR}}/appimage-bundle/install-appimage.sh

        # Test AppImage functionality
        echo "Testing AppImage..."
        {{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage --version 2>/dev/null || echo "⚠️  AppImage test failed - may need additional dependencies"
    vars:
      APP_NAME: '{{.APP_NAME}}'
      VERSION: '{{.VERSION | default "1.0.0"}}'
      DESCRIPTION: '{{.DESCRIPTION | default "A science fiction desktop running everywhere"}}'

  test:appimage:
    summary: Test AppImage functionality
    deps:
      - task: create:appimage
    cmds:
      - |
        if [ -f "{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage" ]; then
          echo "✅ AppImage file exists"

          # Test AppImage execution
          if "{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage" --version 2>/dev/null; then
            echo "✅ AppImage executes successfully"
          else
            echo "❌ AppImage execution failed"
            exit 1
          fi

          # Test AppImage integrity
          if file "{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage" | grep -q "ELF 64-bit"; then
            echo "✅ AppImage has correct format"
          else
            echo "❌ AppImage format is invalid"
            exit 1
          fi

          # Check file size (should be reasonable)
          SIZE=$(stat -f%z "{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage" 2>/dev/null || stat -c%s "{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-x86_64.AppImage" 2>/dev/null)
          if [ "$SIZE" -gt 1000000 ]; then  # Greater than 1MB
            echo "✅ AppImage size is reasonable ($(($SIZE / 1000000))MB)"
          else
            echo "❌ AppImage size is too small ($(($SIZE / 1024))KB)"
            exit 1
          fi

          echo "✅ All AppImage tests passed"
        else
          echo "❌ AppImage file not found"
          exit 1
        fi
    vars:
      APP_NAME: '{{.APP_NAME}}'
      VERSION: '{{.VERSION | default "1.0.0"}}'

  create:deb:
    summary: Creates a deb package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: generate:dotdesktop
      - task: generate:deb

  create:rpm:
    summary: Creates a rpm package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: generate:dotdesktop
      - task: generate:rpm

  create:aur:
    summary: Creates a arch linux packager package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: generate:dotdesktop
      - task: generate:aur

  generate:deb:
    summary: Creates a deb package
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format deb -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:rpm:
    summary: Creates a rpm package
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format rpm -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:aur:
    summary: Creates a arch linux packager package
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format archlinux -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:dotdesktop:
    summary: Generates a `.desktop` file
    dir: build
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/linux/appimage
      - wails3 generate .desktop -name "{{.APP_NAME}}" -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop -categories "{{.CATEGORIES}}"
    vars:
      APP_NAME: '{{.APP_NAME}}'
      EXEC: '{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}'
      CATEGORIES: 'Development;'
      OUTPUTFILE: '{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop'

  create:snap:
    summary: Creates a Snap package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
      - task: generate:dotdesktop
    cmds:
      - |-
        # Create snap directory structure
        mkdir -p {{.BIN_DIR}}/snap/{{.APP_NAME}}/bin
        mkdir -p {{.BIN_DIR}}/snap/{{.APP_NAME}}/usr/share/applications
        mkdir -p {{.BIN_DIR}}/snap/{{.APP_NAME}}/usr/share/icons/hicolor/128x128/apps

        # Copy files
        cp {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/snap/{{.APP_NAME}}/bin/
        cp {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop {{.BIN_DIR}}/snap/{{.APP_NAME}}/usr/share/applications/
        cp {{.ROOT_DIR}}/build/appicon.png {{.BIN_DIR}}/snap/{{.APP_NAME}}/usr/share/icons/hicolor/128x128/apps/{{.APP_NAME}}.png

        # Create snap package
        cd {{.BIN_DIR}}/snap
        snapcraft pack --output {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}_{{.VERSION}}_amd64.snap
    vars:
      VERSION: '{{.VERSION | default "1.0.0"}}'

create:tarball:
    summary: Creates a tarball distribution
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
      - task: generate:dotdesktop
    cmds:
      - |-
        # Create tarball directory
        mkdir -p {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/bin
        mkdir -p {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/share/applications
        mkdir -p {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/share/icons

        # Copy files
        cp {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/bin/
        cp {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/share/applications/
        cp {{.ROOT_DIR}}/build/appicon.png {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/share/icons/{{.APP_NAME}}.png

        # Create install script
        echo '#!/bin/bash' > {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'set -e' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'APP_NAME="{{.APP_NAME}}"' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'INSTALL_DIR="/opt/${APP_NAME}"' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'BIN_DIR="/usr/local/bin"' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '# Check if running as root' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'if [ "$EUID" -ne 0 ]; then' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '    echo "Please run as root or use sudo"' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '    exit 1' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'fi' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '# Create installation directory' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'mkdir -p "${INSTALL_DIR}"' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'mkdir -p "${BIN_DIR}"' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '# Copy application files' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'cp -r bin "${INSTALL_DIR}/"' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'cp -r share "${INSTALL_DIR}/"' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '# Create symlink' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'ln -sf "${INSTALL_DIR}/bin/${APP_NAME}" "${BIN_DIR}/${APP_NAME}"' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '# Update desktop database' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'update-desktop-database -q /usr/share/applications 2>/dev/null || true' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || true' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo '' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh
        echo 'echo "Installation complete! You can now run ${APP_NAME} from your applications menu or by typing '\''${APP_NAME}'\'' in terminal."' >> {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh

        chmod +x {{.BIN_DIR}}/tarball/{{.APP_NAME}}-{{.VERSION}}/install.sh

        # Create tarball
        cd {{.BIN_DIR}}/tarball
        tar -czf {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-linux-x86_64.tar.gz {{.APP_NAME}}-{{.VERSION}}/
        rm -rf {{.BIN_DIR}}/tarball
    vars:
      VERSION: '{{.VERSION | default "1.0.0"}}'

update:metadata:
    summary: Updates Linux package metadata with current build info
    cmds:
      - |-
        # Update nfpm.yaml with current version
        sed -i 's/version: ".*"/version: "{{.VERSION}}"/' build/linux/nfpm/nfpm.yaml
        sed -i 's/name: "adex-ui"/name: "{{.APP_NAME}}"/' build/linux/nfpm/nfpm.yaml
        sed -i 's/vendor: "aDex-UI Team"/vendor: "{{.COMPANY_NAME}}"/' build/linux/nfpm/nfpm.yaml
        sed -i 's|homepage: "https://wails.io"|homepage: "{{.HOMEPAGE}}"|' build/linux/nfpm/nfpm.yaml
        sed -i 's|description: "A modern science fiction desktop environment terminal application"|description: "{{.DESCRIPTION}}"|' build/linux/nfpm/nfpm.yaml
    vars:
      VERSION: '{{.VERSION | default "1.0.0"}}'
      COMPANY_NAME: '{{.COMPANY_NAME | default "HackEAC"}}'
      HOMEPAGE: '{{.HOMEPAGE | default "https://github.com/hackeac/adex-ui"}}'
      DESCRIPTION: '{{.DESCRIPTION | default "A science fiction desktop running everywhere"}}'

clean:
    summary: Clean Linux build artifacts
    cmds:
      - rm -f {{.BIN_DIR}}/{{.APP_NAME}}
      - rm -f {{.BIN_DIR}}/*.AppImage
      - rm -f {{.BIN_DIR}}/*-x86_64.AppImage
      - rm -f {{.BIN_DIR}}/*.deb
      - rm -f {{.BIN_DIR}}/*.rpm
      - rm -f {{.BIN_DIR}}/*.tar.gz
      - rm -f {{.BIN_DIR}}/*.pkg.tar.xz
      - rm -f {{.BIN_DIR}}/*.snap
      - rm -rf {{.BIN_DIR}}/snap
      - rm -rf {{.BIN_DIR}}/tarball
      - rm -rf {{.BIN_DIR}}/appimage-bundle
      - rm -rf build/linux/appimage/build

run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
