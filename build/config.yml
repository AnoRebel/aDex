# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
# NOTE: This file is the single source of truth for the application version.
# `frontend/nuxt.config.ts` reads `info.version` from here at config-evaluation
# time so the in-app update checker compares against the same string the binary
# reports. Do not duplicate the version anywhere else.
info:
  companyName: "aDex"
  productName: "aDex"
  productIdentifier: "com.adex.app"
  description: "A modern science fiction desktop environment terminal application"
  copyright: "Copyright © 2026"
  comments: "A modern science fiction desktop environment terminal application"
  version: "1.0.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - openspec
      - docs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
fileAssociations:

# Other data
other:
