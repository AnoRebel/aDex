name: Build and Package

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Must be >= the `go` directive in go.mod, or every job dies at the first
  # `go mod tidy` with "go.mod requires go >= 1.26.0 (running go 1.25.x;
  # GOTOOLCHAIN=local)". Bump this when go.mod's minimum moves.
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  # Track the latest v3 beta rather than pinning: v3 is pre-stable and ships
  # fixes near-daily. See openspec design D1/D7.
  WAILS_VERSION: 'latest'

jobs:
  # Build and test on all platforms
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the rest: with fail-fast on, a
      # macOS error took down the Linux and Windows jobs mid-build and hid
      # whether they would have succeeded.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64
          # arm64 on native runners. Wails is a cgo application, so setting
          # GOOS/GOARCH on an amd64 host cannot build it — that needs a
          # matching C toolchain and platform headers, which these provide.
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-11-arm
            platform: windows
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Platform dependencies FIRST: the wails3 CLI is itself a cgo build, so
      # installing it before GTK4 is present fails with "Package 'gtk4',
      # required by 'virtual:world', not found".
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Wails v3 targets GTK4 + WebKitGTK 6.0 on Linux.
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Task (go-task)
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          wails3 version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (macOS)
        if: matrix.platform == 'darwin'
        run: |
          brew install task

      - name: Build application
        run: |
          task build
        env:
          PRODUCTION: "true"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-' }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          COMMIT: ${{ github.sha }}

      - name: Run tests
        run: |
          task verify:go

      - name: Package application
        run: |
          task package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aDex-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            bin/*
            !bin/*.log
          retention-days: 30

  # Create releases for tags
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Creating a release and uploading its assets writes to the repository.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Uploading SARIF to the code-scanning API needs this; without it the
    # upload fails with "Resource not accessible by integration".
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # securecodewarrior/github-action-gosec was deleted upstream ("repository
      # not found"), which failed this job on every run. Use the scanner
      # directly from the project that maintains it.
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # Build Docker image
