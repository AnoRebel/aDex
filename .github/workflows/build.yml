name: Build and Package

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Must be >= the `go` directive in go.mod, or every job dies at the first
  # `go mod tidy` with "go.mod requires go >= 1.26.0 (running go 1.25.x;
  # GOTOOLCHAIN=local)". Bump this when go.mod's minimum moves.
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  # Track the latest v3 beta rather than pinning: v3 is pre-stable and ships
  # fixes near-daily. See openspec design D1/D7.
  WAILS_VERSION: 'latest'

jobs:
  # Build and test on all platforms
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache frontend dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Task (go-task)
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          wails3 version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Wails v3 targets GTK4 + WebKitGTK 6.0 on Linux.
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'darwin'
        run: |
          brew install task

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install -y nodejs

      - name: Build application
        run: |
          task build
        env:
          PRODUCTION: "true"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-' }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          COMMIT: ${{ github.sha }}

      - name: Run tests
        run: |
          task verify:go

      - name: Package application
        run: |
          task package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aDex-UI-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            bin/*
            !bin/*.log
          retention-days: 30

  # Create releases for tags
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build multi-architecture binaries
  build-multiarch:
    name: Multi-Arch Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup QEMU (for cross-compilation)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The wails3 CLI itself is a cgo build against GTK4/WebKitGTK, so these
      # headers must be present BEFORE `go install` — without them the install
      # fails with "Package 'gtk4', required by 'virtual:world', not found"
      # and the whole arm64 job dies before it compiles anything.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cross-compile binary
        run: |
          task ${{ matrix.target.os }}:build
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          PRODUCTION: "true"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev-' }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          COMMIT: ${{ github.sha }}

      - name: Upload cross-compiled binary
        uses: actions/upload-artifact@v7
        with:
          name: aDex-UI-${{ matrix.target.os }}-${{ matrix.target.arch }}-cross
          path: bin/aDex-UI${{ matrix.target.os == 'windows' && '.exe' || '' }}
          retention-days: 30

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # securecodewarrior/github-action-gosec was deleted upstream ("repository
      # not found"), which failed this job on every run. Use the scanner
      # directly from the project that maintains it.
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # Build Docker image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR authenticates with the workflow's own GITHUB_TOKEN, so this
      # needs no configured secrets — the Docker Hub login it replaced failed
      # with "Username and password required" on every run.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
